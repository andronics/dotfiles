# The live override: this file, linked to ~/.config/barctl/modules.toml, replaces the
# default that desktop-tools ships (src/desktop_tools/barctl/modules.toml in
# andronics/desktop-tools) whole. It began as a copy of v0.1.0's default and matches v0.1.2's
# (crew's table came with the cut-over from coord); the package's copy is the default, and this
# one is what the desktop runs. Edit here, then `barctl reload`.
#
# barctl's modules: the default the package ships (dotfiles record 0003 §B4).
#
# The dotfiles' desktop/.config/barctl/modules.toml, linked to $XDG_CONFIG_HOME/barctl/modules.toml,
# replaces this file whole. Each module here is a polybar `custom/ipc` module whose
# `hook-0 = barctl render <module>`. Clicks run detached, through `barctl click <module> <button>`;
# {target} is the module's current target (the shown player, the default sink), filled in as a
# whole argument. Glyphs are current Nerd Font codepoints, written as escapes.

# The default sink's volume, from `pactl subscribe`.
[modules.audio-level]
source = "volume"
display = "both"
glyph = "\U000F0581" # md-volume_off: no pulse server yet

[modules.audio-level.clicks]
left = ["audio", "mute-toggle"]
right = ["pwvucontrol"]
scroll-up = ["audio", "volume-increase"]
scroll-down = ["audio", "volume-decrease"]

# The chosen MPRIS player's icon and play state, from `playerctl -a --follow`: Playing beats
# Paused beats Stopped, then the latest to change. Clicks act on the player the bar shows.
[modules.player-play-pause]
source = "player"
display = "icon"
glyph = "" # fa-stop: no player

[modules.player-play-pause.clicks]
left = ["player", "play-pause", "{target}"]

# The chosen player's "artist: title", cut to 40 characters.
[modules.player-metadata]
source = "player"
display = "text"

# The player capsule (record 0003 §1-2), alongside the old player buttons for now (§7): the
# play-state icon, "Artist – Title" in a fixed width, scrolling while it plays, and the track's
# progress as an underline. Clicks act on the player the capsule shows.
[modules.player-capsule]
source = "player"
display = "capsule"
glyph = "\U000F038A"   # md-music_note_off: before the source has written it
glyph_override = { active = "\U000F040A", idle = "\U000F03E4", unavailable = "\U000F038A" }
width = 32             # cells of text after the icon
scroll = 2.0           # steps per second; 0 cuts with "…" instead
scroll_rest = 10       # seconds the start of the title rests between passes
accent = "role"        # or "art"

[modules.player-capsule.clicks]
left = ["playerctl", "-p", "{target}", "play-pause"]
middle = ["playerctl", "-p", "{target}", "next"]
scroll-up = ["playerctl", "-p", "{target}", "volume", "0.05+"]
scroll-down = ["playerctl", "-p", "{target}", "volume", "0.05-"]
right = ["barmenu", "player"]

# The output segment (desktop-tools record 0003 §10), beside player-capsule on the same background:
# the default sink's kind glyph and short name, a Bluetooth sink's battery, the volume glyph and
# percentage (muted, md-volume_off in the idle colour). Runs alongside audio-level for now.
[modules.output-capsule]
source = "volume"
display = "output"
glyph = "\U000F0581"   # md-volume_off: before the source has written it

[modules.output-capsule.clicks]
left = ["audio", "mute-toggle"]
scroll-up = ["audio", "volume-increase"]
scroll-down = ["audio", "volume-decrease"]
right = ["barmenu", "outputs"]

# The coordinator strip: one cell per coordinator, pushed by crew (brain record 0019 §7, dotfiles
# record 0003 Part C) with each cell's tier (unavailable stopped, idle running, active busy,
# alert waiting for input) and the shown one underlined. A left click shows or hides it, starting
# a stopped one; a right click opens that coordinator's quick menu; a middle click anywhere on the
# strip opens the full menu; scrolling cycles through the running ones (record 0019 §7a).
[modules.crew]
pusher = "crew"
display = "icon"
separator = ""

[modules.crew.segment_clicks]
left = ["crew", "toggle", "--launch", "{segment}"]
middle = ["crew", "menu"]
right = ["crew", "quick", "{segment}"]
scroll-up = ["crew", "cycle", "prev"]
scroll-down = ["crew", "cycle", "next"]

# The password store's light, pushed by tessera (tessera design record 0001 §4) on every watcher
# run and command, with a 20-minute ttl: idle locked and level, active unlocked, alert when entries
# wait, the store has diverged, sync is failing, the first sync is pending or a read was denied, and
# unavailable when nothing has pushed for 20 minutes (the watcher is dead). The label and detail say
# which (`barctl status tessera`). Right-click opens `barmenu tessera` (desktop-tools record 0002).
# The icons are the dotfiles' own, one md-shield family (`glyph_override`, record 0002 §7).
[modules.tessera]
pusher = "tessera"
display = "icon"
glyph = "\U000F099D" # md-shield_lock: before tessera's first push
glyph_override = { idle = "\U000F099D", active = "\U000F199A", alert = "\U000F0ECC", unavailable = "\U000F099C" }
# idle md-shield_lock (locked), active md-shield_lock_open (unlocked), alert md-shield_alert,
# unavailable md-shield_off_outline.

[modules.tessera.clicks]
right = ["barmenu", "tessera"]
