# Later imports override earlier ones and this file overrides them all, so
# colours and fonts live only in the imports. themes/catppuccin-mocha.toml is
# the fallback (today's look, font included); the generated theme from
# `theme apply` overrides it, is skipped while it doesn't exist, and is
# live-reloaded when `current` moves.
general.import = [
    "~/.config/alacritty/themes/catppuccin-mocha.toml",
    "~/.local/state/theme/current/alacritty.toml",
]

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

[scrolling]
history = 10000
multiplier = 3

[window]
decorations = "full"
decorations_theme_variant = "Light"
title = "Alacritty"

[window.dimensions]
columns = 200
lines = 20

[window.padding]
x = 4
y = 4

[window.position]
x = 0
y = 0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
