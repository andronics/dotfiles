; Colours and fonts come from the generated theme: [colors] (roles such as
; bg, bg-alt, fg, accent, urgent, plus the raw palette) and [theme] (fonts,
; height, line-size). polybar refuses to start without this file; `theme
; ensure` (run by .zlogin.d/99-polybar and polybar-reload) makes sure it
; exists. Modules use role names only, never hues.
include-file = ~/.local/state/theme/current/polybar.ini

[global/wm]
margin-top = 5
margin-bottom = 5

[settings]
format-background = ${colors.bg}
format-foreground = ${colors.fg}
;format-margin = 0;
;format-offset = 10
;format-padding = 20
;format-spacing = 300


; ================================================================================

include-directory = modules
include-directory = bars