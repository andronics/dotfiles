; Coordinator switchboard strip (crew, from andronics/desktop-tools; brain
; record 0019 §7): one glyph per coordinator in the bar's colour tiers
; (dotfiles design record 0001): dim when not running, fg_dim while running
; and idle, accent while busy, an urgent pill while waiting on input,
; accent-underlined while shown.
;
; Drawn by barctl like every custom/ipc module: crew pushes a segment per
; coordinator to barctl's `crew` module and never talks to polybar. Each
; glyph carries its own clicks, from `[modules.crew.segment_clicks]` in
; ~/.config/barctl/modules.toml: left shows or hides that coordinator
; (starting a stopped one), right opens its quick menu, middle the full
; menu. Scrolling anywhere on the strip cycles through the running ones.
; The busy, idle and waiting states come from the Claude Code hooks that run
; `crew status`; those hooks live in ~/.claude/settings.json, not in this
; repo, and without them the strip still shows running, hidden and shown.
; No coordinator's name belongs here (tests/coordinator-launchers.zsh).

[module/crew]
inherit = module/base-ipc
type = custom/ipc
hook-0 = barctl render crew
scroll-up = crew cycle prev
scroll-down = crew cycle next
