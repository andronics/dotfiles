; Bar menu buttons. Most open a rofi menu just above the button: `barmenu
; <menu>` (dotlib _barmenu, rofi/themes/bar-menu.rasi), whose table holds the
; rows. The power button opens `power menu` (dotlib _power) through `barmenu
; run`, which, like the menus, starts it detached from polybar's pipes.
; menu-theme and menu-lock are still polybar custom/menu.

[module/menu-layout]
inherit = module/base-text-inverse
label = "缾"
click-left = barmenu layout

[module/menu-lock]
inherit = module/base-menu-inverse
label-open = ""
label-close = ""
menu-0-0 = "󱫟 DISABLE"
menu-0-0-exec = lockscreen hook-disable
menu-0-1 = "󱫡 ENABLE"
menu-0-1-exec = lockscreen hook-enable
menu-0-2 = "󱫗 TRIGGER"
menu-0-2-exec = lockscreen hook-trigger

[module/menu-power]
inherit = module/base-text-inverse
label = "襤"
click-left = barmenu run power menu

[module/menu-screenshot]
inherit = module/base-text-inverse
label = "󰄀"
click-left = barmenu screenshot

[module/menu-session]
inherit = module/base-text-inverse
label = ""
click-left = barmenu session

[module/menu-settings]
inherit = module/base-text-inverse
label = ""
click-left = barmenu settings

[module/menu-theme]
inherit = module/base-menu-inverse
label-open = "󰏘"
label-close = "󰏘"
menu-0-0 = " REFRESH"
menu-0-0-exec = theme reload
menu-0-1 = "󰳝 UNDO"
menu-0-1-exec = theme undo
menu-0-2 = "󰋜 DEFAULT"
menu-0-2-exec = theme apply default

[module/menu-vpn]
inherit = module/base-text-inverse
label = "嬨"
click-left = barmenu vpn
