; Bar menu buttons. Most open a rofi menu just above the button: `barmenu
; <menu>` (andronics/desktop-tools, rofi/themes/bar-menu.rasi), whose
; menus.toml holds the rows. The power button opens `power menu` (dotlib
; _power) through `barmenu run`, which, like the menus, starts it detached
; from polybar's pipes.

[module/menu-layout]
inherit = module/base-text-inverse
label = "缾"
click-left = barmenu layout

[module/menu-lock]
inherit = module/base-text-inverse
label = ""
click-left = barmenu lock

[module/menu-power]
inherit = module/base-text-inverse
label = "襤"
click-left = barmenu run power menu

[module/menu-screenshot]
inherit = module/base-text-inverse
label = "󰄀"
click-left = barmenu screenshot

[module/menu-session]
inherit = module/base-text-inverse
label = ""
click-left = barmenu session

[module/menu-settings]
inherit = module/base-text-inverse
label = ""
click-left = barmenu settings

[module/menu-theme]
inherit = module/base-text-inverse
label = "󰏘"
click-left = barmenu theme

[module/menu-vpn]
inherit = module/base-text-inverse
label = "嬨"
click-left = barmenu vpn
