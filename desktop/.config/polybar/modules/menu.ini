[module/menu-layout]
inherit = module/base-menu-inverse
label-open = "缾"
label-close = "缾"
menu-0-0 = "DEFAULT"
menu-0-0-exec = bsp-layout set tiled
menu-0-1 = "EVEN"
menu-0-1-exec = bsp-layout set even
menu-0-2 = "GRID HORIZONTAL"
menu-0-2-exec = bsp-layout set grid
menu-0-3 = "GRID VERTICAL"
menu-0-3-exec = bsp-layout set rgrid
menu-0-4 = "TALL LEFT"
menu-0-4-exec = bsp-layout set tall
menu-0-5 = "TALL RIGHT"
menu-0-5-exec = bsp-layout set rtall
menu-0-6 = "WIDE TOP"
menu-0-6-exec = bsp-layout set wide
menu-0-7 = "WIDE BOTTOM"
menu-0-7-exec = bsp-layout set rwide

[module/menu-lock]
inherit = module/base-menu-inverse
label-open = ""
label-close = ""
menu-0-0 = "󱫟 DISABLE"
menu-0-0-exec = lockscreen hook-disable
menu-0-1 = "󱫡 ENABLE"
menu-0-1-exec = lockscreen hook-enable
menu-0-2 = "󱫗 TRIGGER"
menu-0-2-exec = lockscreen hook-trigger

[module/menu-power]
inherit = module/base-menu-inverse
label-open = "襤"
label-close = "襤"
menu-0-0 = "⏾ SLEEP"
menu-0-0-exec = slock & ~/.config/scripts/power.sh suspend
menu-0-1 = " HIBERNATE"
menu-0-1-exec = ~/.config/scripts/power.sh hibernate
menu-0-2 = "ﰇ REBOOT"
menu-0-2-exec = ~/.config/scripts/power.sh reboot
menu-0-3 = "  SHUTDOWN"
menu-0-3-exec = ~/.config/scripts/power.sh poweroff

[module/menu-screenshot]
inherit = module/base-menu-inverse
label-open = "󰄀"
label-close = "󰄀"
menu-0-0 = " FULLSCREEN"
menu-0-0-exec = screenshot fullscreen
menu-0-1 = " GEOMETRY"
menu-0-1-exec = screenshot geometry
menu-0-2 = " SELECTION"
menu-0-2-exec = screenshot selection
menu-0-3 = " WINDOW"
menu-0-3-exec = screenshot window

[module/menu-session]
inherit = module/base-menu-inverse
label-open = ""
label-close = ""
menu-0-0 = "﫼 QUIT"
menu-0-0-exec = bspc quit
menu-0-1 = "勒 COMPOSITOR"
menu-0-1-exec = killall -eq picom ; sleep 1.5 && picom --config ~/.config/picom/picom.conf -b

[module/menu-settings]
inherit = module/base-menu-inverse
label-open = ""
label-close = ""
menu-0-0 = "BSPWM"
menu-0-0-exec = code ~/.config/bspwm
menu-0-1 = "POLYBAR"
menu-0-1-exec = code ~/.config/polybar
menu-0-2 = "DOTFILES"
menu-0-2-exec = code ~/.dotfiles
menu-0-3 = "SXHKD"
menu-0-3-exec = code ~/.config/sxhkd/sxhkdrc

[module/menu-theme]
inherit = module/base-menu-inverse
label-open = "󰏘"
label-close = "󰏘"
menu-0-0 = " REFRESH"
menu-0-0-exec = rofi-theme refresh
menu-0-1 = "󰳝 PREV"
menu-0-1-exec = rofi-theme previous
menu-0-2 = "󰳟 NEXT"
menu-0-2-exec = rofi-theme next
menu-0-3 = "󰲍 SELECT"
menu-0-3-exec = rofi-theme select

[module/menu-vpn]
inherit = module/base-menu-inverse
label-open = "嬨"
label-close = "嬨"
menu-0-0 = "旅 CONNECT"
menu-0-0-exec = nordvpn connect
menu-0-1 = " Disconnect"
menu-0-1-exec = nordvpn disconnect
menu-0-2 = " Information"
menu-0-2-exec = dunstify -t 0 "VPN Status" "$(nordvpn status)"







