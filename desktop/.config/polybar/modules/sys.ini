
[module/sys-date]
inherit = module/base-script
exec = printf "%b %s\\n" "\\uF5EC" "$(date '+%Y-%m-%d')"
interval = 300

[module/sys-idle]
inherit = module/base-script
exec = printf "%b %1s min\\n" "\\uEB7C" "$(echo ""$(xprintidle) 60000 / p"" | dc)"
interval = 1

[module/sys-time]
inherit = module/base-script
exec = printf "%b %s\\n" "\\uE385" "$(date '+%H:%M')"
interval = 10

