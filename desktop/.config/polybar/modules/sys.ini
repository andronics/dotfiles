
[module/sys-date]
inherit = module/base-script
exec = printf "%b %s" "\\uF5EC" "$(date '+%Y-%m-%d')"
interval = 300

[module/sys-idle]
inherit = module/base-script
exec = printf "%b %1s min" "\\uEB7C" "$(echo ""$(xprintidle) 60000 / p"" | dc)"
interval = 1

[module/sys-time]
inherit = module/base-script
exec = printf "%b %s" "\\uE385" "$(date '+%H:%M')"
interval = 10

[module/sys-uptime]
inherit = module/base-script
exec = printf "%b %s" "\\uF062" "$(uptime --pretty | sed 's/up //' | sed 's/\ years\?,/y/' | sed 's/\ weeks\?,/w/' | sed 's/\ days\?,/d/' | sed 's/\ hours\?,\?/h/' | sed 's/\ minutes\?/m/')"
interval = 30