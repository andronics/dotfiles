[module/audio]
inherit = module/base-script
interval = 5
click-right = pwvucontrol &
click-left = audio mute-toggle

[module/audio-device]
inherit = module/audio
exec = printf "%b %-16s\\n" "$(audio device-icon)" "$(audio device-name)"
scroll-up = audio sink-next
scroll-down = audio sink-previous

; Event-driven: barctl follows `pactl subscribe` and pokes this module when
; the default sink's volume or mute changes (dim with no pulse server,
; fg-dim when muted, accent otherwise).
[module/audio-level]
inherit = module/base-ipc
type = custom/ipc
hook-0 = barctl render audio-level
click-right = pwvucontrol &
click-left = audio mute-toggle
scroll-up = audio volume-increase
scroll-down = audio volume-decrease

[module/audio-spectrum]
inherit = module/base-script-inverse
; exec = audio spectrum
; tail = true
interval = 1
format-padding = 5


