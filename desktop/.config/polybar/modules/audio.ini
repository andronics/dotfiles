[module/audio]
inherit = module/base-script
interval = 5
click-right = pwvucontrol &
click-left = audio mute-toggle

[module/audio-device]
inherit = module/audio
exec = printf "%b %-16s\\n" "$(audio device-icon)" "$(audio device-name)"
scroll-up = audio sink-next
scroll-down = audio sink-previous

; Event-driven: barctl (andronics/desktop-tools) follows `pactl subscribe`
; and pokes this module when the default sink's volume or mute changes (dim
; with no pulse server, fg-dim when muted, accent otherwise). Its clicks are
; in ~/.config/barctl/modules.toml; `barctl click` runs them detached.
[module/audio-level]
inherit = module/base-ipc
type = custom/ipc
hook-0 = barctl render audio-level
click-right = barctl click audio-level right
click-left = barctl click audio-level left
scroll-up = barctl click audio-level scroll-up
scroll-down = barctl click audio-level scroll-down

; output-capsule (desktop-tools record 0003 §10): the default sink's kind glyph, name, Bluetooth
; battery and volume in one module beside player-capsule; right-click opens `barmenu outputs`.
; Clicks are in ~/.config/barctl/modules.toml.
[module/output-capsule]
inherit = module/base-ipc-inverse
type = custom/ipc
hook-0 = barctl render output-capsule
click-left = barctl click output-capsule left
click-right = barctl click output-capsule right
scroll-up = barctl click output-capsule scroll-up
scroll-down = barctl click output-capsule scroll-down

[module/audio-spectrum]
inherit = module/base-script-inverse
; exec = audio spectrum
; tail = true
interval = 1
format-padding = 5


