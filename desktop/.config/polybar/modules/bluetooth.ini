[module/bluetooth]
inherit = module/base-script
interval = 5
click-left = bt menu
click-right = bt power-toggle

[module/bluetooth-status]
inherit = module/bluetooth
exec = printf "%b %-16s" "$(bt status-icon)" "$(bt status-name)"
scroll-up = bt connect
scroll-down = bt disconnect

[module/bluetooth-icon]
inherit = module/bluetooth
exec = bt status-icon

