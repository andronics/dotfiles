; Desktop strip (desk, shell/.local/share/dotlib/_desk): one fixed-width
; cell per non-empty bspwm desktop holding one app icon, rotating through
; the desktop's apps every DESK_ROTATE seconds (default 1), drawn like the
; crew strip: focused underlined in the accent, urgent an urgent pill, then
; the focused desktop's mode (monocle, floating, fullscreen, sticky) and a dim
; + cell. Left-click focuses a desktop, middle-click sends the focused window
; to it; on + they run `desk new` and `desk new --take`. Right-click lists
; windows, scroll steps desktops as the built-in bspwm module did with
; reverse-scroll.
;
; Colours (theme roles accent, urgent, on_urgent, fg, dim) and the gap
; between cells (metrics.cell_gap) come from the generated theme.zsh, read
; once when `desk watch` starts: the polybar restart that `theme reload
; polybar` does restarts it on the new theme.
;
; custom/script with tail: `desk watch` follows `bspc subscribe` and prints
; a new line only when the strip changes (events, or a rotation tick while
; some desktop has two or more apps), pruning empty desktops as you leave
; them. It shows $HOST_MONITOR's desktops (bars/base's monitor), so a
; bar per monitor gets its own strip. modules/bspwm.ini is kept: swapping
; `desk` back to `bspwm` in bars/main reverts.

[module/desk]
type = custom/script
exec = desk watch
tail = true
format = <label>
format-foreground = ${colors.fg}
format-background = ${colors.bg}
format-padding = 3
click-right = rofi -show window -show-icons -theme bar-popup
scroll-up = bspc desktop -f prev.local
scroll-down = bspc desktop -f next.local
