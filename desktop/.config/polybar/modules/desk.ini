; Desktop strip (desk, shell/.local/share/dotlib/_desk): one cell of app
; icons per non-empty bspwm desktop, drawn like the coord strip: focused
; underlined lavender, urgent a red pill, then the focused desktop's mode
; (monocle, floating, fullscreen, sticky) and a dim + cell. Left-click
; focuses a desktop, middle-click sends the focused window to it; on + they
; run `desk new` and `desk new --take`. Right-click lists windows, scroll
; steps desktops as the built-in bspwm module did with reverse-scroll.
;
; custom/script with tail: `desk watch` follows `bspc subscribe` and prints
; a new line only when the strip changes, pruning empty desktops as you
; leave them. It shows $HOST_MONITOR's desktops (bars/base's monitor), so a
; bar per monitor gets its own strip. modules/bspwm.ini is kept: swapping
; `desk` back to `bspwm` in bars/main reverts.

[module/desk]
type = custom/script
exec = desk watch
tail = true
format = <label>
format-foreground = ${colors.foreground}
format-background = ${colors.background}
format-padding = 3
click-right = rofi -show window -show-icons
scroll-up = bspc desktop -f prev.local
scroll-down = bspc desktop -f next.local
