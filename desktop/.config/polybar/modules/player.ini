; https://github.com/altdesktop/playerctl

; player-chips (desktop-tools record 0005 phase A): one chip per MPRIS player, before the capsule.
[module/player-chips]
inherit = module/base-ipc-inverse
type = custom/ipc
hook-0 = barctl render player-chips
click-left = barctl click player-chips left
click-middle = barctl click player-chips middle
click-right = barctl click player-chips right

[module/player-instance]
inherit = module/base-text-inverse
exec = player get-instance-name
format-foreground = ${colors.fg}
format-spacing = 2

[module/player-loop]
inherit = module/base-text-inverse
label = 
label-id = F021
click-left = player loop

; player-play-pause and player-metadata are event-driven: barctl
; (andronics/desktop-tools) follows every MPRIS player (`playerctl -a
; --follow`) and shows one, Playing over Paused over Stopped, then the latest
; to change; dim with no player, fg-dim paused or stopped, accent playing.
; barctl cuts the track to 40 characters. Clicks are in
; ~/.config/barctl/modules.toml and act on the player the bar shows.
; player-capsule (dotfiles record 0003 phase 1, desktop-tools record 0003): the icon, the
; track and its progress in one module; right-click opens `barmenu player`.
[module/player-capsule]
inherit = module/base-ipc-inverse
type = custom/ipc
hook-0 = barctl render player-capsule
click-left = barctl click player-capsule left
click-middle = barctl click player-capsule middle
click-right = barctl click player-capsule right
scroll-up = barctl click player-capsule scroll-up
scroll-down = barctl click player-capsule scroll-down

[module/player-metadata]
inherit = module/base-ipc
type = custom/ipc
hook-0 = barctl render player-metadata

[module/player-next]
inherit = module/base-text-inverse
label = 
label-id = F04E
click-left = player next
click-right = player seek 10+

[module/player-play-pause]
inherit = module/base-ipc-inverse
type = custom/ipc
hook-0 = barctl render player-play-pause
click-left = barctl click player-play-pause left

[module/player-previous]
inherit = module/base-text-inverse
label = 
label-id = F04A
click-left = player previous
click-right = player seek 10-

[module/player-seek-backward]
inherit = module/base-text-inverse
label = 玲
label-id = F9AD
click-left = player seek 10+

[module/player-seek-forward]
inherit = module/base-text-inverse
label = 怜
label-id = F9AC
click-left = player seek 10-

[module/player-shuffle]
inherit = module/base-text-inverse
label = 咽
label-id = F99E
click-left = player shuffle

[module/player-stop]
inherit = module/base-text-inverse
label = 
label-id = F04D
click-left = player stop


