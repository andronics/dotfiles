; Coordinator switchboard strip (coord, shell/.local/share/dotlib/_coord): one
; icon per coordinator, dim when not running, peach while busy, a red pill
; while waiting on input, underlined while shown. Left-click toggles that
; coordinator, right-click opens the picker, scroll cycles.
;
; custom/ipc so it redraws only when poked: `coord` runs
; `polybar-msg action coord hook 0` on every show, hide, launch and state
; change. The busy/idle/waiting states come from Claude Code hooks that run
; `coord status`; those hooks live in the user's Claude settings
; (~/.claude/settings.json), not in this repo, and without them the strip
; still shows running, hidden and shown.

[module/coord]
type = custom/ipc
hook-0 = coord bar
initial = 1
format = <output>
format-foreground = ${colors.foreground}
format-background = ${colors.background}
format-padding = 3
click-right = coord pick
scroll-up = coord cycle prev
scroll-down = coord cycle next
