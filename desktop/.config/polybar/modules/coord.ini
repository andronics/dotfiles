; Coordinator switchboard strip (coord, shell/.local/share/dotlib/_coord): one
; icon per coordinator, dim when not running, the busy colour while busy, an
; urgent pill while waiting on input, accent-underlined while shown. Left-click
; toggles that coordinator, right-click opens the picker, scroll cycles.
; The colours are theme roles (dim, busy, urgent, on_urgent, accent) that
; `coord bar` reads from the generated theme.zsh on every redraw, since a
; hook command can't use ${colors.*}; `theme apply` shows on the next poke.
;
; custom/ipc so it redraws only when poked: `coord` runs
; `polybar-msg action coord hook 0` on every show, hide, launch and state
; change. The busy/idle/waiting states come from Claude Code hooks that run
; `coord status`; those hooks live in the user's Claude settings
; (~/.claude/settings.json), not in this repo, and without them the strip
; still shows running, hidden and shown.

[module/coord]
type = custom/ipc
hook-0 = coord bar
initial = 1
format = <output>
format-foreground = ${colors.fg}
format-background = ${colors.bg}
format-padding = 3
click-right = coord pick
scroll-up = coord cycle prev
scroll-down = coord cycle next
