[module/device-bluetooth]
inherit = module/base-text-inverse
label = 
label-id = "F929"
click-left = bt menu &

[module/device-printer]
inherit = module/base-text-inverse
label = 朗
label-id = "F929"
click-left = system-config-printer &


[module/device-scanner]
inherit = module/base-text-inverse
label = 浪
label-id = "F92A"
click-left = simple-scan &

; printer (desktop-tools record 0004), alongside the old device-printer button; clicks are in
; ~/.config/barctl/modules.toml.
[module/printer]
inherit = module/base-ipc-inverse
type = custom/ipc
hook-0 = barctl render printer
click-left = barctl click printer left
click-middle = barctl click printer middle
click-right = barctl click printer right

; scanner (desktop-tools record 0004), alongside the old device-scanner button; clicks are in
; ~/.config/barctl/modules.toml.
[module/scanner]
inherit = module/base-ipc-inverse
type = custom/ipc
hook-0 = barctl render scanner
click-left = barctl click scanner left
click-middle = barctl click scanner middle
click-right = barctl click scanner right
