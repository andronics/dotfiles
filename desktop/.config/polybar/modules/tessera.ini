; The password store's light (tessera, the password-store tool; tessera
; design record 0001 §4). Drawn by barctl like every custom/ipc module:
; tessera pushes `barctl push tessera --source tessera` itself, with a
; 20-minute ttl, and never talks to polybar. The tiers:
;   idle         locked and level with the remote
;   active       "unlocked"
;   alert        "<n> waiting", "diverged", "sync failing",
;                "first sync pending" or "denied"
;   unavailable  no push for 20 minutes: the watcher
;                (tessera-sync.path and .timer) is dead
; No clicks: each alert is fixed at a terminal (`tessera status`).

[module/tessera]
inherit = module/base-ipc
type = custom/ipc
hook-0 = barctl render tessera
