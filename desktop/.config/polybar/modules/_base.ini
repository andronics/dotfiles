[module/base-text]
type = custom/text
format = <label>
label-foreground = ${colors.fg}
label-background = ${colors.bg}
label-font = 1
label-offset = 0
label-padding = 3
label-margin = 0
label-spacing = 0

[module/base-text-inverse]
inherit = module/base-text
type = custom/text
label-foreground = ${colors.fg}
label-background = ${colors.bg-alt}
label-padding = 3

; A script's line ends in a newline (printf "...\\n"): polybar reads one line
; and, without a newline, waits for end-of-file, which a copy of the pipe held
; by another of the bar's children can put off forever, freezing the next
; restart (see _desk-close-inherited in shell/.local/share/dotlib/_desk).
[module/base-script]
type = custom/script
format-foreground = ${colors.fg}
format-background = ${colors.bg}
label-font = 1
format-offset = 0
format-padding = 3
format-margin = 0
format-spacing = 0

[module/base-script-inverse]
inherit = module/base-script
type = custom/script
format-foreground = ${colors.fg}
format-background = ${colors.bg-alt}

; Drawn by the bar controller (barctl, shell/.local/share/dotlib/_barctl):
; the one hook prints the module's current state, coloured from the theme,
; and barctl pokes it when that changes. initial = 1 runs hook-0 at start.
[module/base-ipc]
type = custom/ipc
initial = 1
format = <output>
format-foreground = ${colors.fg}
format-background = ${colors.bg}
format-padding = 3

[module/base-ipc-inverse]
inherit = module/base-ipc
format-background = ${colors.bg-alt}

[module/base-menu]
type = custom/menu
expand-right = true
format = <label-toggle><menu>
label-close-font = 1
label-close-foreground = ${colors.fg}
label-close-background = ${colors.bg}
label-close-padding = 3
label-open-font = 1
label-open-foreground = ${colors.fg}
label-open-background = ${colors.bg}
label-open-padding = 3
menu-0-0-padding = 3
menu-0-1-padding = 3
menu-0-2-padding = 3
menu-0-3-padding = 3
menu-0-4-padding = 3
menu-0-5-padding = 3
menu-0-6-padding = 3
menu-0-7-padding = 3
menu-0-8-padding = 3
menu-0-9-padding = 3


[module/base-menu-inverse]
inherit = module/base-menu
type = custom/menu
label-close-foreground = ${colors.fg}
label-close-background = ${colors.bg-alt}
label-open-foreground = ${colors.fg}
label-open-background = ${colors.bg-alt}
menu-0-0-foreground = ${colors.fg}
menu-0-0-background = ${colors.bg-alt}
menu-0-1-foreground = ${colors.fg}
menu-0-1-background = ${colors.bg-alt}
menu-0-2-foreground = ${colors.fg}
menu-0-2-background = ${colors.bg-alt}
menu-0-3-foreground = ${colors.fg}
menu-0-3-background = ${colors.bg-alt}
menu-0-4-foreground = ${colors.fg}
menu-0-4-background = ${colors.bg-alt}
menu-0-5-foreground = ${colors.fg}
menu-0-5-background = ${colors.bg-alt}
menu-0-6-foreground = ${colors.fg}
menu-0-6-background = ${colors.bg-alt}
menu-0-7-foreground = ${colors.fg}
menu-0-7-background = ${colors.bg-alt}
menu-0-8-foreground = ${colors.fg}
menu-0-8-background = ${colors.bg-alt}
menu-0-9-foreground = ${colors.fg}
menu-0-9-background = ${colors.bg-alt}


