[module/base-text]
type = custom/text
format = <label>
label-foreground = ${colors.foreground}
label-background = ${colors.background}
label-font = 4
label-offset = 0
label-padding = 3
label-margin = 0
label-spacing = 0

[module/base-text-inverse]
inherit = module/base-text
type = custom/text
label-foreground = ${colors.foreground-alt}
label-background = ${colors.background-alt}
label-padding = 3

[module/base-script]
type = custom/script
format-foreground = ${colors.foreground}
format-background = ${colors.background}
label-font = 4
format-offset = 0
format-padding = 3
format-margin = 0
format-spacing = 0

[module/base-script-inverse]
inherit = module/base-script
type = custom/script
format-foreground = ${colors.foreground-alt}
format-background = ${colors.background-alt}

[module/base-menu]
type = custom/menu
expand-right = true
format = <label-toggle><menu>
label-close-font = 4
label-close-foreground = ${colors.foreground}
label-close-background = ${colors.background}
label-close-padding = 3
label-open-font = 4
label-open-foreground = ${colors.foreground}
label-open-background = ${colors.background}
label-open-padding = 3
menu-0-0-padding = 3
menu-0-1-padding = 3
menu-0-2-padding = 3
menu-0-3-padding = 3
menu-0-4-padding = 3
menu-0-5-padding = 3
menu-0-6-padding = 3
menu-0-7-padding = 3
menu-0-8-padding = 3
menu-0-9-padding = 3


[module/base-menu-inverse]
inherit = module/base-menu
type = custom/menu
label-close-foreground = ${colors.foreground-alt}
label-close-background = ${colors.background-alt}
label-open-foreground = ${colors.foreground-alt}
label-open-background = ${colors.background-alt}
menu-0-0-foreground = ${colors.foreground-alt}
menu-0-0-background = ${colors.background-alt}
menu-0-1-foreground = ${colors.foreground-alt}
menu-0-1-background = ${colors.background-alt}
menu-0-2-foreground = ${colors.foreground-alt}
menu-0-2-background = ${colors.background-alt}
menu-0-3-foreground = ${colors.foreground-alt}
menu-0-3-background = ${colors.background-alt}
menu-0-4-foreground = ${colors.foreground-alt}
menu-0-4-background = ${colors.background-alt}
menu-0-5-foreground = ${colors.foreground-alt}
menu-0-5-background = ${colors.background-alt}
menu-0-6-foreground = ${colors.foreground-alt}
menu-0-6-background = ${colors.background-alt}
menu-0-7-foreground = ${colors.foreground-alt}
menu-0-7-background = ${colors.background-alt}
menu-0-8-foreground = ${colors.foreground-alt}
menu-0-8-background = ${colors.background-alt}
menu-0-9-foreground = ${colors.foreground-alt}
menu-0-9-background = ${colors.background-alt}


