# Durable theme knobs, edited by hand. `theme` merges
# ${XDG_STATE_HOME}/theme/overrides.json over this file and never writes it.

default  = "catppuccin-mocha"   # applied on a fresh install or when state is missing
contrast = "aaa"                # aa | aaa: body-text minimum (4.5 / 7.0); aaa falls back to aa only when unreachable
accent   = "scheme"             # scheme (its x-accent slot) | base00..base17 | a palette name | "#rrggbb"
mode     = "dark"               # dark | light: what wallpapers and colours generate (`theme mode` overrides it)

# Point sizes: each base is multiplied by scale. Gaps are not scaled.
[fonts]
scale = 1.25
[fonts.base]
terminal = 13
menu = 11
bar = 10
icon = 13           # polybar's glyphs (Symbols Nerd Font Mono)
notification = 10
gtk = 10

[fonts.family]
ui   = "Roboto Mono for Powerline"
mono = "Source Code Pro for Powerline"
icon = "Symbols Nerd Font Mono"

# Pixels. gap, cell_gap, bar_height and bar_reserve are used as is (the bar
# keeps its height and its text grows inside it); border, window_border,
# radius and padding are multiplied by fonts.scale and rounded.
[metrics]
gap = 5             # bspwm window_gap
border = 2          # polybar underline
window_border = 1   # bspwm border_width (1 x 1.25 rounds to 1)
radius = 8
padding = 12
bar_height = 50
bar_reserve = 32    # bspwm bottom_padding: less than bar_height on purpose (D15)
cell_gap = 8        # polybar desktop strip: offset between cells

[icons]
dark = "Papirus-Dark"
light = "Papirus-Light"

[cursor]
theme = "Adwaita"
size = 24

# Palettes from a wallpaper or a colour (`theme wallpaper`, `theme apply
# colour:#hex`). variant is matugen's scheme type: tonal-spot (calm, the
# Material default), content and fidelity (closest to the picture),
# vibrant, expressive, rainbow, fruit-salad, neutral, monochrome. contrast
# is matugen's own knob, -1..1; the contrast floors above apply on top.
[matugen]
variant = "scheme-tonal-spot"
contrast = 0.0

[gtk]
dark = "adw-gtk3-dark"
light = "adw-gtk3"

# Wallpapers. `theme wallpaper <name>` looks a name or number up in dirs,
# first dir first: the tracked defaults, then untracked images of your own
# (D12; a dir that doesn't exist is skipped). default is used while no
# wallpaper is recorded (a fresh state). `theme list wallpapers` shows them.
[wallpaper]
# The second dir is untracked and holds personal wallpapers.
dirs = ["~/.local/share/backgrounds", "~/.local/share/wallpapers"]
default = "0001"
