system: "base24"
name: "Catppuccin Frappe"
author: "https://github.com/catppuccin/catppuccin"
variant: "dark"
palette:
  base00: "#303446" # base
  base01: "#292c3c" # mantle
  base02: "#414559" # surface0
  base03: "#51576d" # surface1
  base04: "#626880" # surface2
  base05: "#c6d0f5" # text
  base06: "#f2d5cf" # rosewater
  base07: "#babbf1" # lavender
