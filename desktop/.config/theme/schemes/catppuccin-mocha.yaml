# x-* keys are local extensions read by dotlib/_theme: x-accent (slot, name or hex),
# x-pair (light/dark twin), x-roles (role -> slot, name or hex), x-ansi (index -> same),
# x-names (named colours, e.g. Catppuccin's).
system: "base24"
name: "Catppuccin Mocha"
author: "https://github.com/catppuccin/catppuccin"
variant: "dark"
palette:
  base00: "#1e1e2e" # base
  base01: "#181825" # mantle
  base02: "#313244" # surface0
  base03: "#45475a" # surface1
  base04: "#585b70" # surface2
  base05: "#cdd6f4" # text
  base06: "#f5e0dc" # rosewater
  base07: "#b4befe" # lavender
  base08: "#f38ba8" # red
  base09: "#fab387" # peach
  base0A: "#f9e2af" # yellow
  base0B: "#a6e3a1" # green
  base0C: "#94e2d5" # teal
  base0D: "#89b4fa" # blue
  base0E: "#cba6f7" # mauve
  base0F: "#f2cdcd" # flamingo
  base10: "#181825" # mantle - darker background
  base11: "#11111b" # crust - darkest background
  base12: "#eba0ac" # maroon - bright red
  base13: "#f5e0dc" # rosewater - bright yellow
  base14: "#a6e3a1" # green - bright green
  base15: "#89dceb" # sky - bright cyan
  base16: "#74c7ec" # sapphire - bright blue
  base17: "#f5c2e7" # pink - bright purple
slug: "catppuccin-mocha"
x-accent: "base07"   # lavender
x-pair: "catppuccin-latte"
# Catppuccin's own UI roles: subtext0 for secondary text, overlay0 for inactive.
x-roles:
  fg_dim: "subtext0"
  dim: "overlay0"
# Catppuccin's terminal palette (catppuccin/alacritty), not the base24 default mapping.
x-ansi:
  0: "surface1"
  1: "red"
  2: "green"
  3: "yellow"
  4: "blue"
  5: "pink"
  6: "teal"
