name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball" gitleaks
      # The baseline holds leaks already in public history (keys since rotated).
      # It is redacted, so the scan must be too: findings are matched field by
      # field and an unredacted secret would never equal "REDACTED".
      - name: Scan history
        run: ./gitleaks git --redact --no-banner --verbose --baseline-path .gitleaks-baseline.json .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Most scripts here are zsh, which shellcheck can't parse; select sh/bash
      # by shebang. Errors only for now: existing warnings aren't worth a
      # mass-fix PR.
      - name: Run shellcheck
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            [ -f "$f" ] && head -n1 "$f" | grep -qE '^#!.*[/ ](ba|da)?sh$' && printf '%s\0' "$f"
          done | xargs -0 --no-run-if-empty shellcheck -S error
