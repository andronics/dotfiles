# https://starship.rs/config/
# ANSI colour names only, so the prompt follows the terminal's palette (and looks right over SSH).

add_newline = true
scan_timeout = 50

format = """
[╭─ ](bright-black)$sudo$directory$git_branch$package$nodejs$cmd_duration
[│](bright-black)
[╰─ ](bright-black)$character$line_break
"""

[character]
success_symbol = "[❯](cyan)"
error_symbol = "[x](red)"

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
read_only = " "
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "| [$symbol$branch(:$remote_branch)]($style) "
style = "blue"


[hostname]
format = "[󰍹 $hostname]($style)"
style = "bold cyan"
ssh_only = false


[nodejs]
format = "| [$symbol($version )]($style)"
style = "blue"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]
detect_extensions = []

[package]
format = "| [$symbol $version]($style) "
style = "blue"
symbol = " "

[username]
style_user = "bold cyan"
style_root = "bold red"
format = "[ $user]($style)"
disabled = false
show_always = true
